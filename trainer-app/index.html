<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Map trainer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Golos+Text:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1 id="title"><span class="country"></span> <span>map trainer</span></h1>
          <p class="sub" id="subtitle"></p>
        </div>
        <div class="seg big" id="setSeg" role="group" aria-label="What to study" data-i18n-aria="bar.whatToStudy"></div>
      </header>
      <div class="bar">
        <label class="l" id="countryL"
          ><span data-i18n="bar.country">Country</span>
          <select id="country"></select
        ></label>
        <div class="seg" id="modeSeg" role="group" aria-label="Mode" data-i18n-aria="bar.mode">
          <button data-v="learn" data-i18n="mode.learn">Learn</button
          ><button data-v="practice" data-i18n="mode.practice">Practice</button>
        </div>
        <div class="seg" id="kindSeg" role="group" aria-label="Question type" data-i18n-aria="bar.kind">
          <button data-v="find">Find on map</button><button data-v="name">Name it</button
          ><button data-v="town">Place towns</button><button data-v="dot">Pick the dot</button>
        </div>
        <label class="l" id="scopeL"
          ><span data-i18n="ctl.area">Area</span>
          <select id="scope"></select
        ></label>
        <label class="l" id="rselL"
          ><span data-i18n="ctl.river">River</span>
          <select id="rsel"></select
        ></label>
        <label class="l" id="sizeL"
          ><span data-i18n="ctl.round">Round</span>
          <select id="size">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="40">40</option>
            <option value="all" data-i18n="ctl.all">All</option>
          </select></label
        >
        <label class="l" id="telfL"
          ><span id="telfLabel"></span>
          <select id="telf">
            <option value="border" data-i18n="ctl.nearBorders">Near zone borders</option>
            <option value="all" data-i18n="ctl.all">All</option>
          </select></label
        >
        <label class="l" id="askL"
          ><span data-i18n="ctl.askBy">Ask by</span>
          <select id="ask">
            <option value="name" data-i18n="ctl.askName">Name</option>
            <option value="num" data-i18n="ctl.askNumber">Number</option>
            <option value="mix" data-i18n="ctl.askMixed">Mixed</option>
          </select></label
        >
        <label class="l" id="labL"
          ><span data-i18n="ctl.labels">Labels</span>
          <select id="labs">
            <option value="auto" data-i18n="ctl.labelsAuto">Auto</option>
            <option value="num" data-i18n="ctl.labelsNumbers">Numbers</option>
            <option value="name" data-i18n="ctl.labelsNames">Names</option>
            <option value="off" data-i18n="ctl.labelsOff">Off</option>
          </select></label
        >
        <label class="l" id="langL"
          ><span data-i18n="bar.language">Language</span>
          <select id="lang"></select
        ></label>
      </div>
      <div class="app">
        <div class="mapbox" id="box">
          <svg id="map" viewBox="0 0 613 585" preserveAspectRatio="xMidYMid meet" aria-label="Map">
            <g id="land"></g>
            <g id="riv"></g>
            <g id="rvl" class="lab"></g>
            <g id="tw" class="lab cty"></g>
            <g id="zl" class="lab"></g>
            <g id="lp" class="lab"></g>
            <g id="nx" class="lab cty"></g>
            <g id="labD" class="lab"></g>
            <g id="labR" class="lab"></g>
            <g id="cty" class="lab cty"></g>
            <g id="fx"></g>
          </svg>
          <div class="msg" id="msg" data-i18n="app.loadingMap">Loading the map…</div>
          <div class="tip" id="tip"></div>
          <div class="tools">
            <button id="zin" aria-label="Zoom in" data-i18n-aria="map.zoomIn">+</button><button id="zout" aria-label="Zoom out" data-i18n-aria="map.zoomOut">−</button
            ><button id="zre" aria-label="Reset view" data-i18n-aria="map.reset" style="font-size: 15px">⤢</button>
          </div>
        </div>
        <div id="prompt" class="card"></div>
        <div id="more"></div>
      </div>
      <p class="hint credits" id="credits"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
